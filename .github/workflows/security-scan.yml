name: Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js (if needed for package-lock.json)
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies (optional - for more accurate scanning)
        run: |
          if [ -f "package.json" ]; then
            npm install --package-lock-only
          fi
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner (Table format - for logs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: 0
      
      - name: Run Trivy vulnerability scanner (SARIF format - for GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: 0
      
      - name: Verify SARIF file was created
        run: |
          echo "Checking if SARIF file exists..."
          if [ -f "trivy-results.sarif" ]; then
            echo "✅ SARIF file found!"
            ls -lh trivy-results.sarif
            echo "File size: $(wc -c < trivy-results.sarif) bytes"
            echo ""
            echo "First 50 lines of SARIF file:"
            head -n 50 trivy-results.sarif
          else
            echo "❌ SARIF file not found!"
            exit 1
          fi
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs-scan'
      
      - name: Upload SARIF file as artifact (for download)
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-sarif-results
          path: trivy-results.sarif
          retention-days: 30

  summary:
    name: Scan Summary
    runs-on: ubuntu-latest
    needs: trivy-scan
    if: always()
    
    steps:
      - name: Display completion message
        run: |
          echo "🔍 Security scan completed!"
          echo ""
          echo "📊 View results in:"
          echo "  1. Actions tab → This workflow → 'Run Trivy vulnerability scanner' step"
          echo "  2. Security tab → Code scanning alerts"
          echo "  3. Download SARIF artifact from Artifacts section"
          echo ""
          echo "⚠️  If you don't see alerts in Security tab:"
          echo "  - Go to Settings → Code security and analysis"
          echo "  - Enable 'Code scanning' if not already enabled"
          echo "  - Wait 1-2 minutes for results to appear"