name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  trivy-scan:
    name: Trivy Security Scanner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
      
      - name: Generate JSON report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
      
      - name: Display Detailed Vulnerability Report
        if: always()
        run: |
          echo "🔍 SECURITY SCAN COMPLETE"
          echo "================================"
          
          if [ -f "trivy-results.json" ]; then
            # Count vulnerabilities by severity
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo "0")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json 2>/dev/null || echo "0")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json 2>/dev/null || echo "0")
            
            echo "🔴 Critical: $CRITICAL"
            echo "🟠 High: $HIGH"
            echo "🟡 Medium: $MEDIUM"
            echo "🔵 Low: $LOW"
            echo ""
            
            # Display detailed vulnerabilities with file, line number, and severity
            echo "📋 DETAILED VULNERABILITY LIST"
            echo "================================"
            
            jq -r '.Results[]? | 
              select(.Vulnerabilities != null) | 
              .Target as $target | 
              .Vulnerabilities[] | 
              [
                "",
                "📁 FILE: \($target)",
                "🐛 VULNERABILITY: \(.VulnerabilityID) - \(.Title // "N/A")",
                "📦 PACKAGE: \(.PkgName) (\(.InstalledVersion))",
                "⚠️  SEVERITY: \(.Severity)",
                "📍 LINE: \(.PkgPath // "N/A")",
                "🔧 FIXED IN: \(.FixedVersion // "No fix available")",
                "📖 DESCRIPTION: \(.Description // "No description available")",
                "🔗 REFERENCE: \(.PrimaryURL // "N/A")",
                ""
              ] | join("\n")' trivy-results.json 2>/dev/null || echo "No vulnerabilities with detailed information found"
            
            # GitHub Step Summary with detailed breakdown
            {
              echo "## 🔍 Security Scan Results"
              echo ""
              echo "### Summary"
              echo ""
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| 🔴 Critical | $CRITICAL |"
              echo "| 🟠 High | $HIGH |"
              echo "| 🟡 Medium | $MEDIUM |"
              echo "| 🔵 Low | $LOW |"
              echo ""
              echo "### Detailed Vulnerabilities"
              echo ""
              
              # Display top critical and high vulnerabilities in summary
              jq -r '.Results[]? | 
                select(.Vulnerabilities != null) | 
                .Target as $target | 
                .Vulnerabilities[] | 
                [
                  "#### \(.Severity): \(.VulnerabilityID)",
                  "- **File:** \($target)",
                  "- **Package:** \(.PkgName) (\(.InstalledVersion))",
                  "- **Fixed Version:** \(.FixedVersion // "No fix available")",
                  "- **Description:** \(.Title // "N/A")",
                  "- **Reference:** [\(.VulnerabilityID)](\(.PrimaryURL // "#"))",
                  "",
                  "---"
                ] | join("\n")' trivy-results.json 2>/dev/null || echo "No vulnerabilities found"
              
            } >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Create Vulnerability CSV Report
        if: always()
        run: |
          if [ -f "trivy-results.json" ]; then
            echo "File,Package,Installed Version,Vulnerability ID,Severity,Fixed Version,Title,Line/Path" > vulnerabilities.csv
            jq -r '.Results[]? | 
              select(.Vulnerabilities != null) | 
              .Target as $target | 
              .Vulnerabilities[] | 
              [
                $target,
                .PkgName,
                .InstalledVersion,
                .VulnerabilityID,
                .Severity,
                (.FixedVersion // "N/A"),
                (.Title // "N/A"),
                (.PkgPath // "N/A")
              ] | @csv' trivy-results.json >> vulnerabilities.csv 2>/dev/null || true
            
            echo ""
            echo "📊 CSV report generated: vulnerabilities.csv"
            
            # Display CSV preview
            echo ""
            echo "Preview (first 10 rows):"
            head -n 11 vulnerabilities.csv | column -t -s,
          fi
      
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            trivy-results.json
            vulnerabilities.csv
          retention-days: '30'