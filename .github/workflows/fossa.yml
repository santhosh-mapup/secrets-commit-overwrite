name: FOSSA License Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  fossa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install FOSSA CLI
        run: |
          curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash

      - name: FOSSA Analyze
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          fossa analyze --debug

      - name: FOSSA Test (Allow Failure)
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          fossa test --debug || echo "Issues found in license scan, but continuing workflow"

      - name: Summary of FOSSA Issues
        if: ${{ (github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          echo "FOSSA scan completed. Check the FOSSA webapp for detailed issue information."
          echo "Visit: https://app.fossa.com/projects to view your project's license issues."